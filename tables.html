<!DOCTYPE html>

	<style>
  table {
    border: 4px solid black;
    color: #000066;
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  th, td {
    border: 2px solid black;
    color: #000000;
    padding: 10px;
    font-weight: bold;
    text-align: center;
    vertical-align: top;
    height: 70px;
  }

  th:first-child, td:first-child {
    width: 140px;
    white-space: nowrap;
  }

  th:not(:first-child), td:not(:first-child) {
    width: calc((100% - 140px) / 5);
  }

  p {
    margin: 4px 0;
    text-align: center;
    font-weight: bold;
  }

  h2 {
    text-align: center;
  }
  .right { 
	float: right; 
	text-align: right; 
	margin: 6px 0; }
	</style>
